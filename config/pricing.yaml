# VERIFICAR: fill every value below from the OFFICIAL Anthropic pricing page before any paid run.
# Units: USD per 1,000,000 tokens (batch_discount is a fraction, e.g. 0.5 = Batch API pays 50% of the price).
# Paid calls are REFUSED while any value needed by the command is still "VERIFICAR" (or empty).
# Cost estimates in USD are also unavailable until the values are filled.

batch_discount: 0.5

models:
  # Haiku: tier for prompts up to 100,000 tokens (over 100K: input 0.50, output 2.50, not modelled in the
  # cost code; Layer 1 prompts are ~1-2K tokens). cache_write is the 5-minute write price.
  claude-haiku-5-5:
    input: 0.10
    output: 0.50
    cache_read: 0.01
    cache_write: 0.125

  # Sonnet: single price tier. cache_write is the 5-minute write price (1h write: 4).
  claude-sonnet-5-5:
    input: 2
    output: 10
    cache_read: 0.10
    cache_write: 2.50
