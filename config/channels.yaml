# Channels to download transcripts from. Handles were verified with yt-dlp on 2026-11-08.
settings:
  sleep_min: 2            # random pause between video requests (seconds)
  sleep_max: 6
  max_retries: 3          # exponential backoff with jitter between attempts
  backoff_base: 5
  scan_limit: 2000        # newest N videos listed per channel (null = the whole channel). Listing is newest-first
  stop_after_consecutive_old: 3  # stop a channel after N consecutive videos older than min_date
  # max_videos is OPTIONAL per channel: omit it to download everything that passes the filters.
  # Duration/views/title filters live in config/filters.yaml (Layer 0).
  default_max_age_months: 24 # used when a channel has no min_date

channels:
  - name: starter-story
    handle: "@starterstory"
    # min_date: 2024-11-08       # optional, overrides default_max_age_months
    # title_keywords: []         # optional, keep only titles containing any of these
    # languages: [en]            # optional caption languages in order of preference (default [en]).
    #                            # e.g. [ja], [fr], [es, en]. Automatic captions are accepted only when the
    #                            # video's own language matches (never machine translations).

  - name: my-first-million
    handle: "@MyFirstMillionPod"

  - name: greg-isenberg
    handle: "@GregIsenberg"

  - name: alex-hormozi
    handle: "@AlexHormozi"

  - name: codie-sanchez
    handle: "@CodieSanchezCT"   # NOT @CodieSanchez (that handle has no videos tab)

  # Added 2026-11-08 (handles verified with yt-dlp, found via revenue-oriented YouTube searches).
  - name: top-founders-latka
    handle: "@NathanLatkawatch"   # many cases are too big to replicate solo

  - name: koerner-office
    handle: "@thekoerneroffice"   # several recent episodes show 0 views ("early access"): the views filter drops them

  - name: florian-darroman
    handle: "@asyncr0ne"

  - name: saas-club
    handle: "@saasclub"

  - name: niche-pursuits
    handle: "@niche-pursuits"     # mixes SEO/software cases with unrelated Amazon-returns content

  # Added 2026-11-09: non-English channels found by per-country search (quality NOT yet checked;
  # Layer 1 decides). Title rules are English-only, so these titles pass Layer 0 with score 0.
  - name: kojin-product-jp
    handle: "@kojin-product"      # Japan: solo developer, product sold after reaching recurring revenue
    languages: [ja]

  - name: app-radar-jp
    handle: "@app-radar"          # Japan: app revenue case studies (often overseas cases)
    languages: [ja]

  - name: bubecode-jp
    handle: "@bubecode"           # Japan: indie development / monetization, more generic
    languages: [ja]

  - name: compuestos-mx
    handle: "@compuestospodcast"  # Spanish: business interviews
    languages: [es, en]

  - name: actitud-millonaria-mx
    handle: "@soyjosuepena"       # Spanish: many guests are US founders; large catalogue
    languages: [es, en]

  - name: business-en-ligne-fr
    handle: "@businessenligne-maxencerig2613"   # French: online business case studies
    languages: [fr]

  # Indie Hackers: "@IndieHackers" resolves to a channel whose latest upload is unrelated
  # (a Quran recitation), so it is NOT the official channel. The site's terms forbid scraping, so no
  # YouTube channel is configured. Add one here only if an official channel is confirmed.
