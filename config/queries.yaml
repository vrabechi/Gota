# YouTube search queries for `discover` (src/discover.py). Edit freely: nothing is hard-coded.
#
# Pipeline: search (free) -> Layer 0 (free) -> stage A: cheap Haiku screening on the search-result metadata
# (paid, needs --yes) -> stage B: download captions of the survivors -> Layer 1 triage (`triage --channel discover`).

settings:
  results_per_query: 40          # ytsearch<N>; YouTube returns the most relevant, not the newest
  screen:
    model: claude-haiku-5-5
    prompt_version: 1
    min_score: 5                 # stage A keeps results with relevance_score >= this (weaker evidence than Layer 1)
    effort: low
    max_tokens: 200
    est_output_tokens: 60
    description_chars: 400       # the search listing only carries a short description snippet
    estimate_sample_size: 20
  download_channel_name: discover   # survivors are saved in data/transcripts/<this>/

# languages = caption languages tried for the download, in order (see config/channels.yaml).
queries:
  # English
  - {name: en_built_revenue,   text: "how I built a business making per month revenue breakdown",   languages: [en]}
  - {name: en_bought_small,    text: "I bought a small online business case study revenue profit",    languages: [en]}
  - {name: en_solo_mrr,        text: "solo founder bootstrapped MRR interview how it works",          languages: [en]}
  - {name: en_micro_saas,      text: "micro SaaS idea validated customers revenue per month",         languages: [en]}
  - {name: en_niche_site,      text: "niche website SEO income report how much it makes",             languages: [en]}
  - {name: en_boring,          text: "boring businesses that make money owner interview numbers",     languages: [en]}
  - {name: en_productized,     text: "productized service agency solo operator revenue per month",    languages: [en]}
  - {name: en_newsletter,      text: "newsletter business revenue breakdown subscribers sponsors",    languages: [en]}
  # Other languages (country selection discussed on 2026-11-09)
  - {name: es_ingresos,        text: "negocio online ingresos mensuales caso real emprendedor entrevista", languages: [es, en]}
  - {name: es_saas,            text: "fundador SaaS ingresos recurrentes mensuales bootstrapped",          languages: [es, en]}
  - {name: ja_indie,           text: "個人開発 月収 収益 公開 事例",                                        languages: [ja]}
  - {name: ja_saas,            text: "個人開発 SaaS MRR 月商 売上",                                         languages: [ja]}
  - {name: fr_business,        text: "business en ligne chiffre d'affaires par mois étude de cas",          languages: [fr]}
  - {name: de_business,        text: "Online Business Umsatz pro Monat Gründer Fallstudie",                 languages: [de]}
  - {name: ko_business,        text: "1인 창업 월 매출 공개 인터뷰 사업 모델",                              languages: [ko]}
  - {name: hi_business,        text: "ऑनलाइन बिज़नेस महीने की कमाई केस स्टडी फाउंडर",                        languages: [hi, en]}
